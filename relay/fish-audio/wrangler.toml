# Relais Fish Audio de l'app Readest — voir src/index.js pour le pourquoi.
# Deploiement : npx wrangler deploy (depuis ce dossier)
# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put FISH_KEY      # cle API Fish Audio
#   npx wrangler secret put RELAY_TOKEN   # jeton que l'app envoie en X-Relay-Token
name = "readest-fish-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# 120 requetes / minute / IP. Lecture a vitesse x2 avec prechargement : ~30.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Traduction naturelle (/v1/translate) : IA de Cloudflare, sur le forfait
# gratuit (10 000 neurones par jour). Limite separee pour qu'une rafale de
# traductions ne prive jamais la voix de ses requetes.
[ai]
binding = "AI"

[[ratelimits]]
name = "TRANSLATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
