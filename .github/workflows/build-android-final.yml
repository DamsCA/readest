name: Build Android (Claire — release + auto-update)

# Final personal build: signed release arm64 APK. Uploads the APK +
# latest.json to the relay (relay/fish-audio, /maj/) so "install once, update
# forever" works.
#
# Voice (Oct 2026): Fish Audio's free model with the "Claire" voice, reached
# through a Cloudflare Worker relay (relay/fish-audio). The Fish key lives in
# the Worker's secrets and is NOT embedded.
#
# The relay token (23 Nov 2026): it ships in the APK, so the APK must never be
# public. It used to be a build *variable* (printed in this public repo's
# logs) and the APK a public GitHub Release: anyone could take the token and
# spend Damien's Claude key through /v1/rewrite. Now the token is a *secret*
# (masked in logs), and the APK is only served by the relay behind that token.
#
# No longer configured, and why:
#   - Claire self-hosted server + Kokoro: retired and archived (Sept 2026).
#     With CLAIRE_R2_URL set, the Fish client chased their dead tunnels and
#     never reached Fish Audio at all.
#   - Gemini: the Google project answers 403 "denied access" / 429 "quota"
#     (measured 10 Oct 2026, 0/8 requests). Left in, it stayed the default
#     engine and caused the "reads a few sentences, skips the rest" outage.
on:
  workflow_dispatch:
  push:
    branches:
      - claire-release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: create .env.local (Fish Audio via relay, no key)
        run: |
          f=apps/readest-app/.env.local
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> $f
          # Refuse to ship a voiceless app: without the relay, Fish reports
          # itself unavailable and the reader silently falls back to Edge.
          if [ -z "${{ vars.FISH_RELAY_URL }}" ] || [ -z "$FISH_RELAY_TOKEN" ]; then
            echo "::error::variable FISH_RELAY_URL / secret FISH_RELAY_TOKEN not set" && exit 1
          fi
          echo "NEXT_PUBLIC_FISH_RELAY_URL=${{ vars.FISH_RELAY_URL }}" >> $f
          echo "NEXT_PUBLIC_FISH_RELAY_TOKEN=$FISH_RELAY_TOKEN" >> $f
          # The in-app updater reads latest.json + the APK from the relay,
          # behind the token (never a public GitHub Release: see the top).
          echo "NEXT_PUBLIC_UPDATER_BASE_URL=${{ vars.FISH_RELAY_URL }}/maj/$FISH_RELAY_TOKEN" >> $f
        env:
          FISH_RELAY_TOKEN: ${{ secrets.FISH_RELAY_TOKEN }}

      - name: typecheck
        run: pnpm --filter @readest/readest-app exec tsgo --noEmit

      - name: setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          # The action defaults to "tools platform-tools". Google has since
          # removed the legacy "tools" package from its repository: on 11 Oct
          # 2026 sdkmanager answered "Failed to find package 'tools'" and exited
          # 1, failing the build before it compiled anything (the identical step
          # passed on 8 Sept). Nothing in this build uses it.
          packages: platform-tools

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/readest-app/src-tauri

      - name: build + sign release arm64 APK, upload it with latest.json to the relay
        shell: bash
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          RELAY_URL: ${{ vars.FISH_RELAY_URL }}
          FISH_RELAY_TOKEN: ${{ secrets.FISH_RELAY_TOKEN }}
          UPLOAD_KEY: ${{ secrets.CLAIRE_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          version="$(node -p "require('./package.json').version")-claire.${{ github.run_number }}"

          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

          # Stamp the real version into package.json AFTER the reset above, so the
          # bundled app (getAppVersion) and the APK both report "0.11.12-claire.N".
          # This makes the in-app updater's semver compare work: the next build
          # (claire.N+1) is strictly greater, so it's detected and offered.
          node -e "const fs=require('fs');const p=require('./package.json');p.version='${version}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Stamped app version: ${version}"

          # Android app-signing keystore (stable → updates accepted)
          pushd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          popd

          # Disable R8/ProGuard minification for the release build: it strips the
          # native-bridge plugin's OAuth (auth_with_custom_tab) since there are no
          # keep rules, which silently broke Google sign-in (worked in debug, not
          # release). Matches the working debug behaviour.
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' \
            src-tauri/gen/android/app/build.gradle.kts

          pnpm tauri android build --apk -t aarch64

          apk_src="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          apk_name="Readest-Claire_${version}_arm64.apk"
          cp "$apk_src" "$apk_name"

          # updater signature (.sig) for the APK
          pnpm tauri signer sign "$apk_name"
          sig="$(cat "${apk_name}.sig")"

          url="${RELAY_URL}/maj/${FISH_RELAY_TOKEN}/${apk_name}"
          cat > latest.json <<JSON
          {
            "version": "${version}",
            "notes": "Mise à jour Claire",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "android-arm64": { "signature": "${sig}", "url": "${url}" }
            }
          }
          JSON

          # The APK first, then latest.json: the updater never sees a version
          # whose APK is not there yet. Never `gh release`: the repo is public.
          for f in "$apk_name" latest.json; do
            curl --fail --silent --show-error -X PUT -H "X-Upload-Key: ${UPLOAD_KEY}" \
              --upload-file "$f" "${RELAY_URL}/maj/${f}"
            echo
          done
          echo "Uploaded ${apk_name} and latest.json to the relay."
